<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" fill="none">
  <!-- Fondo y borde general del diagrama -->
  <rect width="920" height="540" rx="16" fill="#0f0f11"/>
  <rect x="1" y="1" width="918" height="538" rx="15" stroke="#222226" stroke-width="2"/>

  <!-- Encabezado del diagrama -->
  <g transform="translate(40, 35)">
    <circle cx="6" cy="6" r="6" fill="#22c55e" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="3" fill="#22c55e"/>
    <text x="24" y="10" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="0.5">FLUJO DE CAPAS Y PROCESAMIENTO DE DATOS</text>
    <text x="24" y="28" fill="#888888" font-family="Inter, sans-serif" font-size="12">Ciclo de vida de una transacción de inventario: desde la solicitud HTTP hasta la persistencia ACID</text>
  </g>

  <!-- Paso 1: Cliente Angular -->
  <g transform="translate(40, 85)">
    <rect width="180" height="415" rx="10" fill="#141418" stroke="#282832" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="38" rx="10" fill="#1c1c22"/>
    <rect x="0" y="28" width="180" height="10" fill="#1c1c22"/>
    <circle cx="16" cy="19" r="4" fill="#ef4444"/>
    <circle cx="28" cy="19" r="4" fill="#eab308"/>
    <circle cx="40" cy="19" r="4" fill="#22c55e"/>
    <text x="54" y="23" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">1. Cliente Web</text>

    <!-- Contenido paso 1 -->
    <rect x="15" y="55" width="150" height="75" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="25" y="77" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Usuario / Cajero</text>
    <text x="25" y="93" fill="#888888" font-family="Inter, sans-serif" font-size="10">Registra venta o</text>
    <text x="25" y="107" fill="#888888" font-family="Inter, sans-serif" font-size="10">movimiento de stock</text>

    <rect x="15" y="145" width="150" height="110" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="25" y="167" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">HTTP Request</text>
    <text x="25" y="185" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">POST /api/ventas</text>
    <text x="25" y="201" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">Authorization: Bearer</text>
    <text x="25" y="217" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">Payload: VentaDTO</text>
    <text x="25" y="233" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">Content-Type: JSON</text>

    <rect x="15" y="270" width="150" height="115" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="25" y="292" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Recepción Respuesta</text>
    <text x="25" y="310" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">HTTP 201 Created</text>
    <text x="25" y="328" fill="#888888" font-family="Inter, sans-serif" font-size="9">Actualización reactiva</text>
    <text x="25" y="342" fill="#888888" font-family="Inter, sans-serif" font-size="9">de existencias en UI</text>
    <text x="25" y="358" fill="#888888" font-family="Inter, sans-serif" font-size="9">con State Signals</text>
  </g>

  <!-- Flecha 1 -> 2 -->
  <g transform="translate(225, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#22c55e" stroke-width="2"/>
    <polygon points="35,0 27,-4 27,4" fill="#22c55e"/>
    <text x="2" y="-8" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="8">REQ</text>
  </g>

  <!-- Paso 2: Security & Controller -->
  <g transform="translate(265, 85)">
    <rect width="195" height="415" rx="10" fill="#141418" stroke="#282832" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="38" rx="10" fill="#1c1c22"/>
    <rect x="0" y="28" width="195" height="10" fill="#1c1c22"/>
    <circle cx="16" cy="19" r="4" fill="#22c55e"/>
    <text x="30" y="23" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">2. Security &amp; Controller</text>

    <rect x="15" y="55" width="165" height="95" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="77" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">JwtAuthFilter</text>
    <text x="23" y="94" fill="#888888" font-family="Inter, sans-serif" font-size="9">• Validación criptográfica</text>
    <text x="23" y="108" fill="#888888" font-family="Inter, sans-serif" font-size="9">• Extracción de Claims</text>
    <text x="23" y="122" fill="#888888" font-family="Inter, sans-serif" font-size="9">• SecurityContextHolder</text>
    <text x="23" y="136" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Roles: [ADMIN, CAJERO]</text>

    <rect x="15" y="165" width="165" height="105" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="187" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">VentaRestController</text>
    <text x="23" y="204" fill="#888888" font-family="Inter, sans-serif" font-size="9">• Binding de DTO</text>
    <text x="23" y="218" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">• @Valid (NotNull, Min)</text>
    <text x="23" y="232" fill="#888888" font-family="Inter, sans-serif" font-size="9">• Manejo @ControllerAdvice</text>
    <text x="23" y="246" fill="#888888" font-family="Inter, sans-serif" font-size="9">• Delegación a Service</text>

    <rect x="15" y="285" width="165" height="100" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="307" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">DTO &amp; Validation</text>
    <text x="23" y="324" fill="#888888" font-family="Inter, sans-serif" font-size="9">Filtrado seguro de campos</text>
    <text x="23" y="338" fill="#888888" font-family="Inter, sans-serif" font-size="9">evitando exposición de</text>
    <text x="23" y="352" fill="#888888" font-family="Inter, sans-serif" font-size="9">entidades JPA en el API</text>
  </g>

  <!-- Flecha 2 -> 3 -->
  <g transform="translate(465, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#22c55e" stroke-width="2"/>
    <polygon points="35,0 27,-4 27,4" fill="#22c55e"/>
    <text x="2" y="-8" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="8">INVOKE</text>
  </g>

  <!-- Paso 3: Service Layer (Lógica y Transacción) -->
  <g transform="translate(505, 85)">
    <rect width="200" height="415" rx="10" fill="#141418" stroke="#282832" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="38" rx="10" fill="#1c1c22"/>
    <rect x="0" y="28" width="200" height="10" fill="#1c1c22"/>
    <circle cx="16" cy="19" r="4" fill="#eab308"/>
    <text x="30" y="23" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">3. Capa de Servicios</text>

    <rect x="15" y="55" width="170" height="60" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="77" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">@Transactional</text>
    <text x="23" y="93" fill="#888888" font-family="Inter, sans-serif" font-size="9">Gestión atómica ACID:</text>
    <text x="23" y="105" fill="#888888" font-family="Inter, sans-serif" font-size="9">commit o rollback en error</text>

    <rect x="15" y="125" width="170" height="135" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="147" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="10" font-weight="600">Reglas de Negocio:</text>
    <text x="23" y="165" fill="#888888" font-family="Inter, sans-serif" font-size="9">1. Verifica existencia de SKU</text>
    <text x="23" y="180" fill="#888888" font-family="Inter, sans-serif" font-size="9">2. Valida stockDisponible &gt;= cant</text>
    <text x="23" y="195" fill="#888888" font-family="Inter, sans-serif" font-size="9">3. Descuenta stock_actual</text>
    <text x="23" y="210" fill="#888888" font-family="Inter, sans-serif" font-size="9">4. Calcula subtotal e IVA</text>
    <text x="23" y="225" fill="#888888" font-family="Inter, sans-serif" font-size="9">5. Genera ticket / movimiento</text>
    <text x="23" y="240" fill="#888888" font-family="Inter, sans-serif" font-size="9">6. Alerta si stock &lt; mínimo</text>

    <rect x="15" y="270" width="170" height="115" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="292" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Spring Data Repositories</text>
    <text x="23" y="310" fill="#888888" font-family="Inter, sans-serif" font-size="9">Inyección de repositorios:</text>
    <text x="23" y="325" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">ProductoRepository</text>
    <text x="23" y="340" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">VentaRepository</text>
    <text x="23" y="355" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">MovimientoRepository</text>
  </g>

  <!-- Flecha 3 -> 4 -->
  <g transform="translate(710, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="35,0 27,-4 27,4" fill="#3b82f6"/>
    <text x="5" y="-8" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="8">SQL</text>
  </g>

  <!-- Paso 4: Base de Datos PostgreSQL -->
  <g transform="translate(750, 85)">
    <rect width="130" height="415" rx="10" fill="#141418" stroke="#282832" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="38" rx="10" fill="#1c1c22"/>
    <rect x="0" y="28" width="130" height="10" fill="#1c1c22"/>
    <circle cx="16" cy="19" r="4" fill="#3b82f6"/>
    <text x="28" y="23" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">4. PostgreSQL</text>

    <rect x="12" y="55" width="106" height="50" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="74" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="10">BEGIN TX</text>
    <text x="18" y="90" fill="#888888" font-family="Inter, sans-serif" font-size="9">Aislamiento ReadCommitted</text>

    <rect x="12" y="115" width="106" height="60" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="133" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="9">UPDATE productos</text>
    <text x="18" y="147" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">SET stock = stock - ?</text>
    <text x="18" y="161" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">WHERE id = ?</text>

    <rect x="12" y="185" width="106" height="60" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="203" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="9">INSERT INTO ventas</text>
    <text x="18" y="217" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">VALUES (id, total,</text>
    <text x="18" y="231" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">fecha, usuario_id)</text>

    <rect x="12" y="255" width="106" height="60" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="273" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="9">INSERT INTO movs</text>
    <text x="18" y="287" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">Trazabilidad</text>
    <text x="18" y="301" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">y auditoría</text>

    <rect x="12" y="325" width="106" height="50" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="345" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">COMMIT</text>
    <text x="18" y="360" fill="#888888" font-family="Inter, sans-serif" font-size="9">Persistencia exitosa</text>
  </g>
</svg>
