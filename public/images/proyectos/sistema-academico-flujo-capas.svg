<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" fill="none">
  <!-- Fondo y borde general del diagrama -->
  <rect width="920" height="540" rx="16" fill="#0f0f11"/>
  <rect x="1" y="1" width="918" height="538" rx="15" stroke="#222226" stroke-width="2"/>

  <!-- Encabezado del diagrama -->
  <g transform="translate(40, 35)">
    <circle cx="6" cy="6" r="6" fill="#38bdf8" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
    <text x="24" y="10" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="0.5">FLUJO DE REGISTRO Y SINCRONIZACIÓN DE NOTAS</text>
    <text x="24" y="28" fill="#888888" font-family="Inter, sans-serif" font-size="12">Integración reactiva Flutter (BLoC) con API REST y persistencia relacional en MySQL</text>
  </g>

  <!-- Paso 1: Interfaz Móvil Flutter -->
  <g transform="translate(40, 85)">
    <rect width="180" height="415" rx="10" fill="#141418" stroke="#282832" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="38" rx="10" fill="#1c1c22"/>
    <rect x="0" y="28" width="180" height="10" fill="#1c1c22"/>
    <circle cx="16" cy="19" r="4" fill="#38bdf8"/>
    <text x="30" y="23" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">1. Mobile UI (Flutter)</text>

    <rect x="15" y="55" width="150" height="85" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="25" y="77" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Docente en el Aula</text>
    <text x="25" y="93" fill="#888888" font-family="Inter, sans-serif" font-size="10">Selecciona curso,</text>
    <text x="25" y="107" fill="#888888" font-family="Inter, sans-serif" font-size="10">asignatura y periodo.</text>
    <text x="25" y="121" fill="#888888" font-family="Inter, sans-serif" font-size="10">Ingresa notas (0.0-5.0)</text>

    <rect x="15" y="155" width="150" height="110" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="25" y="177" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Form Validation</text>
    <text x="25" y="195" fill="#888888" font-family="Inter, sans-serif" font-size="9">Validación inmediata:</text>
    <text x="25" y="209" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">nota &gt;= 0.0 &amp;&amp; &lt;= 5.0</text>
    <text x="25" y="225" fill="#888888" font-family="Inter, sans-serif" font-size="9">Control de campos vacíos</text>
    <text x="25" y="241" fill="#888888" font-family="Inter, sans-serif" font-size="9">y formato decimal</text>

    <rect x="15" y="280" width="150" height="105" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="25" y="302" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Feedback Visual</text>
    <text x="25" y="320" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">✓ Sincronizado</text>
    <text x="25" y="338" fill="#888888" font-family="Inter, sans-serif" font-size="9">Cálculo de promedio del</text>
    <text x="25" y="352" fill="#888888" font-family="Inter, sans-serif" font-size="9">grupo actualizado en vivo</text>
  </g>

  <!-- Flecha 1 -> 2 -->
  <g transform="translate(225, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="35,0 27,-4 27,4" fill="#38bdf8"/>
    <text x="2" y="-8" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">EVENT</text>
  </g>

  <!-- Paso 2: State Management (BLoC) -->
  <g transform="translate(265, 85)">
    <rect width="195" height="415" rx="10" fill="#141418" stroke="#282832" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="38" rx="10" fill="#1c1c22"/>
    <rect x="0" y="28" width="195" height="10" fill="#1c1c22"/>
    <circle cx="16" cy="19" r="4" fill="#38bdf8"/>
    <text x="30" y="23" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">2. BLoC &amp; Network</text>

    <rect x="15" y="55" width="165" height="95" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="77" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CalificacionesBloc</text>
    <text x="23" y="94" fill="#888888" font-family="Inter, sans-serif" font-size="9">Recibe evento:</text>
    <text x="23" y="108" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="9">GuardarNotasEvent</text>
    <text x="23" y="122" fill="#888888" font-family="Inter, sans-serif" font-size="9">Emite estado:</text>
    <text x="23" y="136" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="9">CalificacionesLoading</text>

    <rect x="15" y="165" width="165" height="110" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="187" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Http Client (Dio)</text>
    <text x="23" y="204" fill="#888888" font-family="Inter, sans-serif" font-size="9">Interceptores:</text>
    <text x="23" y="218" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">• Token Bearer Injection</text>
    <text x="23" y="232" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">• Timeout (10 segundos)</text>
    <text x="23" y="246" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">• Retry on network loss</text>

    <rect x="15" y="290" width="165" height="95" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="312" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Cache Local</text>
    <text x="23" y="329" fill="#888888" font-family="Inter, sans-serif" font-size="9">Respaldo en memoria local</text>
    <text x="23" y="343" fill="#888888" font-family="Inter, sans-serif" font-size="9">para prevenir pérdida ante</text>
    <text x="23" y="357" fill="#888888" font-family="Inter, sans-serif" font-size="9">cortes repentinos de señal</text>
  </g>

  <!-- Flecha 2 -> 3 -->
  <g transform="translate(465, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="35,0 27,-4 27,4" fill="#38bdf8"/>
    <text x="2" y="-8" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">REST</text>
  </g>

  <!-- Paso 3: API REST & Validación de Negocio -->
  <g transform="translate(505, 85)">
    <rect width="200" height="415" rx="10" fill="#141418" stroke="#282832" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="38" rx="10" fill="#1c1c22"/>
    <rect x="0" y="28" width="200" height="10" fill="#1c1c22"/>
    <circle cx="16" cy="19" r="4" fill="#22c55e"/>
    <text x="30" y="23" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">3. Backend REST API</text>

    <rect x="15" y="55" width="170" height="70" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="77" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Auth &amp; Role Check</text>
    <text x="23" y="93" fill="#888888" font-family="Inter, sans-serif" font-size="9">Verifica que el docente sea</text>
    <text x="23" y="105" fill="#888888" font-family="Inter, sans-serif" font-size="9">el titular de la asignatura</text>

    <rect x="15" y="135" width="170" height="120" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="157" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="10" font-weight="600">Reglas Académicas:</text>
    <text x="23" y="175" fill="#888888" font-family="Inter, sans-serif" font-size="9">1. Valida fecha límite de entrega</text>
    <text x="23" y="190" fill="#888888" font-family="Inter, sans-serif" font-size="9">2. Bloquea periodos cerrados</text>
    <text x="23" y="205" fill="#888888" font-family="Inter, sans-serif" font-size="9">3. Pondera porcentajes (100%)</text>
    <text x="23" y="220" fill="#888888" font-family="Inter, sans-serif" font-size="9">4. Registra auditoría de cambios</text>
    <text x="23" y="235" fill="#888888" font-family="Inter, sans-serif" font-size="9">5. Calcula promedio acumulado</text>

    <rect x="15" y="265" width="170" height="120" rx="6" fill="#101013" stroke="#24242e"/>
    <text x="23" y="287" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Procesamiento Batch</text>
    <text x="23" y="305" fill="#888888" font-family="Inter, sans-serif" font-size="9">Procesa la lista completa</text>
    <text x="23" y="319" fill="#888888" font-family="Inter, sans-serif" font-size="9">del salón en una única</text>
    <text x="23" y="333" fill="#888888" font-family="Inter, sans-serif" font-size="9">transacción, minimizando</text>
    <text x="23" y="347" fill="#888888" font-family="Inter, sans-serif" font-size="9">viajes de red (roundtrips)</text>
  </g>

  <!-- Flecha 3 -> 4 -->
  <g transform="translate(710, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="35,0 27,-4 27,4" fill="#f59e0b"/>
    <text x="5" y="-8" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8">SQL</text>
  </g>

  <!-- Paso 4: Base de Datos MySQL -->
  <g transform="translate(750, 85)">
    <rect width="130" height="415" rx="10" fill="#141418" stroke="#282832" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="38" rx="10" fill="#1c1c22"/>
    <rect x="0" y="28" width="130" height="10" fill="#1c1c22"/>
    <circle cx="16" cy="19" r="4" fill="#f59e0b"/>
    <text x="28" y="23" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">4. MySQL</text>

    <rect x="12" y="55" width="106" height="50" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="74" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">BEGIN</text>
    <text x="18" y="90" fill="#888888" font-family="Inter, sans-serif" font-size="9">Transacción ACID</text>

    <rect x="12" y="115" width="106" height="85" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="133" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="9">INSERT INTO</text>
    <text x="18" y="147" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="9">calificaciones</text>
    <text x="18" y="163" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">ON DUPLICATE</text>
    <text x="18" y="177" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">KEY UPDATE</text>
    <text x="18" y="191" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">nota = VALUES(nota)</text>

    <rect x="12" y="210" width="106" height="60" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="228" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="9">Integridad FK</text>
    <text x="18" y="244" fill="#888888" font-family="Inter, sans-serif" font-size="8">Claves foráneas:</text>
    <text x="18" y="258" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">matricula_id, curso</text>

    <rect x="12" y="280" width="106" height="50" rx="5" fill="#101013" stroke="#24242e"/>
    <text x="18" y="300" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">COMMIT</text>
    <text x="18" y="315" fill="#888888" font-family="Inter, sans-serif" font-size="9">Datos persistidos</text>
  </g>
</svg>
