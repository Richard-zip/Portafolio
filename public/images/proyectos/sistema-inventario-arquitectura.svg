<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" fill="none">
  <!-- Fondo y borde general del contenedor de arquitectura -->
  <rect width="900" height="520" rx="16" fill="#0f0f11"/>
  <rect x="1" y="1" width="898" height="518" rx="15" stroke="#222226" stroke-width="2"/>

  <!-- Título del diagrama -->
  <g transform="translate(40, 40)">
    <circle cx="6" cy="6" r="6" fill="#22c55e" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="3" fill="#22c55e"/>
    <text x="24" y="10" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="0.5">ARQUITECTURA DEL SISTEMA DE INVENTARIO</text>
    <text x="24" y="28" fill="#888888" font-family="Inter, sans-serif" font-size="12">Despliegue multi-contenedor con Docker Compose y Spring Boot</text>
  </g>

  <!-- Contenedor exterior: Entorno Docker Compose -->
  <rect x="40" y="85" width="820" height="395" rx="12" fill="#141417" stroke="#2a2a30" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="60" y="75" width="165" height="22" rx="4" fill="#1a1a20" stroke="#33333d" stroke-width="1"/>
  <text x="70" y="90" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">DOCKER NETWORK (BRIDGE)</text>

  <!-- Capa 1: Frontend SPA (Angular) -->
  <g transform="translate(70, 120)">
    <rect width="210" height="330" rx="10" fill="#18181c" stroke="#2e2e38" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="42" rx="10" fill="#202026"/>
    <rect x="0" y="32" width="210" height="10" fill="#202026"/>
    <circle cx="20" cy="21" r="4" fill="#ef4444"/>
    <circle cx="34" cy="21" r="4" fill="#eab308"/>
    <circle cx="48" cy="21" r="4" fill="#22c55e"/>
    <text x="65" y="26" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Frontend (Angular)</text>

    <!-- Módulos dentro de Angular -->
    <rect x="15" y="60" width="180" height="50" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="82" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="12" font-weight="500">Módulo Autenticación</text>
    <text x="25" y="98" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Login / Interceptor JWT</text>

    <rect x="15" y="125" width="180" height="50" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="147" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="12" font-weight="500">Gestión de Productos</text>
    <text x="25" y="163" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Catálogo, SKU, Precios</text>

    <rect x="15" y="190" width="180" height="50" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="212" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="12" font-weight="500">Control de Stock</text>
    <text x="25" y="228" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Entradas / Salidas / Alertas</text>

    <rect x="15" y="255" width="180" height="50" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="277" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="12" font-weight="500">Punto de Venta &amp; Reportes</text>
    <text x="25" y="293" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Facturación &amp; Métricas</text>
  </g>

  <!-- Flecha 1 -> 2: Peticiones HTTP REST -->
  <g transform="translate(280, 270)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="65,0 55,-5 55,5" fill="#22c55e"/>
    <rect x="5" y="-22" width="55" height="16" rx="3" fill="#16161a"/>
    <text x="10" y="-10" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">HTTPS/REST</text>
    <text x="8" y="14" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">Bearer JWT</text>
  </g>

  <!-- Capa 2: Backend Spring Boot -->
  <g transform="translate(350, 120)">
    <rect width="260" height="330" rx="10" fill="#18181c" stroke="#2e2e38" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="42" rx="10" fill="#202026"/>
    <rect x="0" y="32" width="260" height="10" fill="#202026"/>
    <circle cx="20" cy="21" r="5" fill="#22c55e"/>
    <text x="35" y="26" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Backend (Spring Boot 3)</text>

    <!-- Subcapas Spring Boot -->
    <rect x="15" y="55" width="230" height="48" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="76" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Spring Security + JWT Filter</text>
    <text x="25" y="92" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Validación de Token &amp; Roles</text>

    <rect x="15" y="115" width="230" height="48" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="136" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">REST Controllers (OpenAPI 3)</text>
    <text x="25" y="152" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Endpoints CRUD, Swagger UI</text>

    <rect x="15" y="175" width="230" height="60" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="196" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Service Layer (Lógica de Negocio)</text>
    <text x="25" y="212" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">@Transactional (Control de Stock)</text>
    <text x="25" y="226" fill="#888888" font-family="Inter, sans-serif" font-size="9">Validación de existencias y cálculos</text>

    <rect x="15" y="247" width="230" height="55" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="268" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Data Access (Spring Data JPA)</text>
    <text x="25" y="284" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Hibernate ORM / Entidades / DTOs</text>
  </g>

  <!-- Flecha 2 -> 3: Conexión JDBC HikariCP -->
  <g transform="translate(610, 270)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="65,0 55,-5 55,5" fill="#3b82f6"/>
    <rect x="5" y="-22" width="55" height="16" rx="3" fill="#16161a"/>
    <text x="12" y="-10" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="9">HikariCP</text>
    <text x="7" y="14" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">TCP :5432</text>
  </g>

  <!-- Capa 3: Base de Datos PostgreSQL -->
  <g transform="translate(680, 150)">
    <rect width="155" height="265" rx="10" fill="#18181c" stroke="#2e2e38" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="42" rx="10" fill="#202026"/>
    <rect x="0" y="32" width="155" height="10" fill="#202026"/>
    <circle cx="20" cy="21" r="5" fill="#3b82f6"/>
    <text x="35" y="26" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">PostgreSQL 16</text>

    <!-- Tablas -->
    <rect x="15" y="60" width="125" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="82" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">users / roles</text>

    <rect x="15" y="105" width="125" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="127" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">products / sku</text>

    <rect x="15" y="150" width="125" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="172" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">stock_movements</text>

    <rect x="15" y="195" width="125" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="217" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">sales / details</text>
  </g>
</svg>
