<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" fill="none">
  <!-- Fondo y borde general del contenedor de arquitectura -->
  <rect width="900" height="500" rx="16" fill="#0f0f11"/>
  <rect x="1" y="1" width="898" height="498" rx="15" stroke="#222226" stroke-width="2"/>

  <!-- Título del diagrama -->
  <g transform="translate(40, 40)">
    <circle cx="6" cy="6" r="6" fill="#3b82f6" fill-opacity="0.2"/>
    <circle cx="6" cy="6" r="3" fill="#3b82f6"/>
    <text x="24" y="10" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="0.5">ARQUITECTURA DEL SISTEMA ACADÉMICO ESCOLAR</text>
    <text x="24" y="28" fill="#888888" font-family="Inter, sans-serif" font-size="12">Integración móvil multiplataforma (Flutter) y backend REST con MySQL</text>
  </g>

  <!-- Capa 1: Dispositivo Móvil (Flutter) -->
  <g transform="translate(60, 95)">
    <rect width="230" height="360" rx="12" fill="#18181c" stroke="#2e2e38" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="42" rx="12" fill="#202026"/>
    <rect x="0" y="32" width="230" height="10" fill="#202026"/>
    <circle cx="20" cy="21" r="5" fill="#38bdf8"/>
    <text x="35" y="26" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Mobile (Flutter / Dart)</text>

    <!-- Subcapas Flutter Clean Arch -->
    <rect x="15" y="55" width="200" height="60" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="78" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Presentation Layer (UI)</text>
    <text x="25" y="94" fill="#888888" font-family="Inter, sans-serif" font-size="10">Vistas de Calificaciones, Asistencias,</text>
    <text x="25" y="107" fill="#888888" font-family="Inter, sans-serif" font-size="10">Estudiantes y Reportes por Período</text>

    <rect x="15" y="125" width="200" height="60" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="148" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">State Management</text>
    <text x="25" y="164" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">BLoC / Provider Pattern</text>
    <text x="25" y="177" fill="#888888" font-family="Inter, sans-serif" font-size="9">Control reactivo y estado offline</text>

    <rect x="15" y="195" width="200" height="60" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="218" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Data &amp; Network Layer</text>
    <text x="25" y="234" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Dio / HTTP Client + Interceptores</text>
    <text x="25" y="247" fill="#888888" font-family="Inter, sans-serif" font-size="9">Inyección de token y retry policy</text>

    <rect x="15" y="265" width="200" height="45" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="286" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Local Cache (SharedPreferences)</text>
    <text x="25" y="300" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">Almacenamiento seguro de sesión</text>
  </g>

  <!-- Conector Flutter -> API -->
  <g transform="translate(290, 270)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="70,0 60,-5 60,5" fill="#38bdf8"/>
    <rect x="8" y="-22" width="55" height="16" rx="3" fill="#16161a"/>
    <text x="12" y="-10" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">HTTPS/REST</text>
    <text x="10" y="14" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">JSON / JWT</text>
  </g>

  <!-- Capa 2: Backend REST Service -->
  <g transform="translate(365, 95)">
    <rect width="250" height="360" rx="12" fill="#18181c" stroke="#2e2e38" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#202026"/>
    <rect x="0" y="32" width="250" height="10" fill="#202026"/>
    <circle cx="20" cy="21" r="5" fill="#22c55e"/>
    <text x="35" y="26" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Backend REST API</text>

    <!-- Subcapas API -->
    <rect x="15" y="55" width="220" height="55" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="78" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Auth &amp; Role Middleware</text>
    <text x="25" y="94" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Roles: Docente, Admin, Acudiente</text>

    <rect x="15" y="120" width="220" height="55" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="143" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Controlador de Notas</text>
    <text x="25" y="159" fill="#888888" font-family="Inter, sans-serif" font-size="10">Registro masivo y cálculo de promedios</text>

    <rect x="15" y="185" width="220" height="55" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="208" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Controlador de Asistencia</text>
    <text x="25" y="224" fill="#888888" font-family="Inter, sans-serif" font-size="10">Registro por fecha, curso y periodo</text>

    <rect x="15" y="250" width="220" height="60" rx="6" fill="#121215" stroke="#282832"/>
    <text x="25" y="273" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Business Validation Layer</text>
    <text x="25" y="289" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">Cierres de periodo &amp; validación notas</text>
  </g>

  <!-- Conector Backend -> MySQL -->
  <g transform="translate(615, 270)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="65,0 55,-5 55,5" fill="#f59e0b"/>
    <rect x="7" y="-22" width="55" height="16" rx="3" fill="#16161a"/>
    <text x="14" y="-10" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">TCP/Pool</text>
    <text x="10" y="14" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">Port :3306</text>
  </g>

  <!-- Capa 3: Base de Datos MySQL -->
  <g transform="translate(685, 120)">
    <rect width="160" height="310" rx="12" fill="#18181c" stroke="#2e2e38" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="42" rx="12" fill="#202026"/>
    <rect x="0" y="32" width="160" height="10" fill="#202026"/>
    <circle cx="20" cy="21" r="5" fill="#f59e0b"/>
    <text x="35" y="26" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">MySQL Database</text>

    <!-- Tablas académicas -->
    <rect x="15" y="55" width="130" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="77" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">estudiantes</text>

    <rect x="15" y="100" width="130" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="122" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">asignaturas</text>

    <rect x="15" y="145" width="130" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="167" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">matriculas</text>

    <rect x="15" y="190" width="130" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="212" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">calificaciones</text>

    <rect x="15" y="235" width="130" height="35" rx="5" fill="#121215" stroke="#282832"/>
    <text x="23" y="257" fill="#e5e5e5" font-family="'JetBrains Mono', monospace" font-size="11">asistencias</text>
  </g>
</svg>
